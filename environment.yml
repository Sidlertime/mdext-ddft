# Environment for mdext-ddft (MD reference data with LAMMPS).
# Linux and macOS (LAMMPS is not available for Windows on conda-forge; use WSL2).
name: mdext-ddft
channels:
  - conda-forge
dependencies:
  - python=3.12
  - lammps=2024.08.29
  - mpi4py
  - numpy
  - scipy
  - h5py
  - pyyaml
  - matplotlib
  - ffmpeg                 # saving .mp4 movies of the density profiles
  - pip
  - pip:
      - -e .
